/* ═════════ Сайт в интернете (хранится на GitHub) ═════════ */
class GhError extends Error { constructor(status, message, where) { super(message || ''); this.status = status; this.where = where; } }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const GH = {
  token: null, scopes: null,
  async api(method, path, body, o = {}) {
    const headers = { Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    if (this.token && !o.anon) headers.Authorization = 'Bearer ' + this.token;
    if (body) headers['Content-Type'] = 'application/json';
    let res;
    try { res = await fetch('https://api.github.com' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
    catch (e) { throw new GhError(0, 'network'); }
    if (path === '/user') this.scopes = res.headers.get('x-oauth-scopes');
    if (!res.ok) { let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) { /* без текста */ } throw new GhError(res.status, msg); }
    if (res.status === 204) return null;
    if (o.raw) return o.binary ? new Uint8Array(await res.arrayBuffer()) : res.text();
    return res.json();
  },
};
function ghMessage(e) {
  if (!(e instanceof GhError)) return 'Что-то пошло не так: ' + ((e && e.message) || e);
  if (e.status === 0) return 'Нет связи с GitHub. Проверьте интернет. Если интернет есть — возможно, GitHub сейчас недоступен у вашего провайдера; попробуйте позже.';
  if (e.status === 401) return 'Ключ не подошёл: он введён с ошибкой, удалён или истёк.';
  if (e.status === 403 && /rate limit/i.test(e.message)) return 'GitHub временно ограничил число запросов. Подождите несколько минут и попробуйте снова.';
  if (e.status === 403) return 'GitHub отказал в доступе: у ключа не хватает разрешений' + (e.message ? ' (' + e.message + ')' : '') + '.';
  if (e.status === 404) return 'GitHub не нашёл хранилище журнала. Возможно, оно удалено или ключ к нему не подходит.';
  return 'GitHub не принял запрос (' + e.status + (e.message ? ': ' + e.message : '') + ').';
}
async function retry(fn, tries = 12, ms = 1500) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) { if (i >= tries - 1 || !(e instanceof GhError) || ![404, 409, 422].includes(e.status)) throw e; await sleep(ms); }
  }
}
const repoBase = t => `/repos/${t.owner}/${t.repo}`;
const rawUrl = (t, path) => `https://raw.githubusercontent.com/${t.owner}/${t.repo}/${t.branch}/${path}`;
const pubT = c => ({ owner: c.owner, repo: c.repo, branch: c.branch });
const privT = c => ({ owner: c.owner, repo: c.priv, branch: c.pb || 'main' });
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'image/avif': 'avif', 'image/bmp': 'bmp' };
const MIME = Object.fromEntries(Object.entries(EXT).map(([m, x]) => [x, m]));
function toB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(b64) { const s = atob(b64), out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
const dataUrl = (bytes, ext) => 'data:' + (MIME[ext] || 'image/jpeg') + ';base64,' + toB64(bytes);
async function imageData(id) {
  const src = IMG[id];
  if (src.startsWith('data:')) {
    const m = /^data:([^;,]+)[^,]*;base64,(.*)$/s.exec(src); if (!m) throw new Error('Не удалось прочитать картинку');
    return { bytes: fromB64(m[2]), ext: EXT[m[1]] || 'jpg' };
  }
  let res; try { res = await fetch(src, { cache: 'no-store' }); } catch (e) { throw new GhError(0, 'network'); }
  if (!res.ok) throw new GhError(res.status, 'image');
  return { bytes: new Uint8Array(await res.arrayBuffer()), ext: (/\.(\w+)$/.exec(src) || [0, 'jpg'])[1] };
}

const Git = {
  async headOf(t) {
    const ref = await GH.api('GET', `${repoBase(t)}/git/ref/heads/${t.branch}`);
    const commit = await GH.api('GET', `${repoBase(t)}/git/commits/${ref.object.sha}`);
    return { head: ref.object.sha, tree: commit.tree.sha };
  },
  async tree(t, treeSha) {
    const r = await GH.api('GET', `${repoBase(t)}/git/trees/${treeSha}?recursive=1`), files = r.tree.filter(x => x.type === 'blob');
    return { paths: new Set(files.map(x => x.path)), shas: Object.fromEntries(files.map(x => [x.path, x.sha])) };
  },
  async blob(t, content) {
    const body = typeof content === 'string' ? { content, encoding: 'utf-8' } : { content: toB64(content), encoding: 'base64' };
    return (await GH.api('POST', `${repoBase(t)}/git/blobs`, body)).sha;
  },
  async commit(t, at, entries, message) {
    const tree = await GH.api('POST', `${repoBase(t)}/git/trees`, { base_tree: at.tree, tree: entries.map(e => ({ path: e.path, mode: '100644', type: 'blob', sha: e.sha })) });
    const commit = await GH.api('POST', `${repoBase(t)}/git/commits`, { message, tree: tree.sha, parents: [at.head] });
    try { await GH.api('PATCH', `${repoBase(t)}/git/refs/heads/${t.branch}`, { sha: commit.sha, force: false }); }
    catch (e) { if (e instanceof GhError && e.status === 422) e.where = 'ref'; throw e; }
    return { head: commit.sha, tree: tree.sha };
  },
};

/* Что видят другие: всё, кроме скрытых записей и личных заметок у персонажей */
function filterState(src, o = {}) {
  const st = blankState(), keep = {};
  st.settings.theme = src.settings.theme; st.settings.sessionsAsc = src.settings.sessionsAsc;
  st.campaigns = src.campaigns.filter(c => !o.campaignId || c.id === o.campaignId).map(clone);
  const cids = new Set(st.campaigns.map(c => c.id));
  st.settings.campaign = cids.has(src.settings.campaign) ? src.settings.campaign : (st.campaigns[0] ? st.campaigns[0].id : null);
  for (const t of Object.keys(TYPES)) {
    st[t] = (t === 'notes' && o.notes === false ? [] : src[t].filter(e => cids.has(e.campaignId) && !e.secret)).map(clone);
    keep[t] = new Set(st[t].map(e => e.id));
  }
  st.sessions.forEach(x => { for (const k of ['characters', 'locations', 'threads']) x[k] = (x[k] || []).filter(id => keep[k].has(id)); });
  st.threads.forEach(x => { x.characters = (x.characters || []).filter(id => keep.characters.has(id)); });
  if (!o.charNotes) st.characters.forEach(x => { x.notes = ''; });
  st.boards = (src.boards || []).filter(b => cids.has(b.campaignId) && !b.secret).map(clone);
  return st;
}
function usedImages(st) {
  const u = new Set(), add = id => { if (id) u.add(id); };
  st.campaigns.forEach(c => { add(c.cover); for (const v of [c.bg, c.bgCustom]) if (v && !v.startsWith('preset:')) add(v); });
  st.sessions.forEach(e => (e.images || []).forEach(add));
  st.characters.forEach(e => { add(e.portrait); (e.images || []).forEach(add); });
  st.locations.forEach(e => { add(e.image); (e.images || []).forEach(add); });
  (st.boards || []).forEach(b => b.items.forEach(it => add(it.img)));
  return u;
}

const Sync = {
  cfg: null, pub: null, prv: null, status: 'ok', error: '', conflict: false, timer: null, running: false, again: false, loading: null, progress: null,
  async open(t) { const at = await Git.headOf(t), tr = await Git.tree(t, at.tree); return { t, at, paths: tr.paths, shas: tr.shas }; },
  /* Обычные правки сохраняются через полторы секунды. Рисование на доске — через 5 секунд тишины и не чаще раза в 15 секунд:
     у GitHub есть предел на число записей в час, и доска не должна его выбрать. */
  schedule(delay = 1500) {
    this.status = 'dirty'; this.pending = true; this.paint();
    const now = Date.now(); if (!this.since) this.since = now;
    if (delay <= 1500) this.quick = true;
    const at = this.quick ? now + 1500 : Math.max(Math.min(now + delay, this.since + 45000), (this.last || 0) + 15000);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), at - now);
  },
  async run(force) {
    clearTimeout(this.timer);
    if (this.running) { this.again = true; return; }
    this.running = true; this.again = false; this.pending = false; this.since = 0; this.quick = false; this.status = 'saving'; this.paint();
    try { if (this.loading) await this.loading; await this.push(force); this.status = 'ok'; this.error = ''; this.conflict = false; }
    catch (e) {
      console.error(e); this.status = 'error';
      this.conflict = e instanceof GhError && e.where === 'ref';
      this.error = this.conflict ? 'Журнал изменили с другого устройства или вкладки.' : ghMessage(e);
    }
    this.running = false; this.last = Date.now();
    if (this.status === 'ok' && this.again) return this.run();
    if (this.status === 'ok' && this.pending) this.status = 'dirty';
    this.paint();
    if (this.status === 'error' && !this.conflict) toast('Не сохранено: ' + this.error, 6000);
    if (this.conflict) askConflict();
  },
  async push(force) {
    const c = this.cfg;
    if (!this.prv || force) this.prv = await this.open(privT(c));
    if (!this.pub || force) this.pub = await this.open(pubT(c));
    const snap = clone(S), pub = filterState(snap), pubImgs = usedImages(pub), old = snap.files || {};
    const files = {}, plan = { prv: [], pub: [] }, entries = { prv: [], pub: [] };
    for (const id of usedImages(snap)) {
      if (!/^[\w-]+$/.test(id) || (!IMG[id] && !old[id])) continue;
      const priv = !pubImgs.has(id), prev = old[id], key = priv ? 'prv' : 'pub';
      if (prev && prev.priv === priv && this[key].paths.has(`img/${id}.${prev.ext}`)) { files[id] = prev; continue; }
      if (!IMG[id]) { files[id] = prev; continue; }          // картинка ещё не загрузилась — оставляем как было
      files[id] = { ext: null, priv }; plan[key].push(id);
    }
    const total = plan.prv.length + plan.pub.length; let done = 0;
    for (const key of ['prv', 'pub']) for (const id of plan[key]) {
      let d;
      try { d = await imageData(id); }
      catch (e) { if (e instanceof GhError && e.status === 404) { delete files[id]; continue; } throw e; }   // файла уже нет — сохраняем остальное
      if (!IMG[id].startsWith('data:')) IMG[id] = dataUrl(d.bytes, d.ext);   // картинка переезжает между хранилищами
      files[id].ext = d.ext;
      entries[key].push({ path: `img/${id}.${d.ext}`, sha: await Git.blob(this[key].t, d.bytes) });
      done++; if (this.progress) this.progress(done, total);
    }
    for (const key of ['prv', 'pub']) {
      const wanted = new Set(Object.entries(files).filter(([, f]) => f.priv === (key === 'prv')).map(([id, f]) => `img/${id}.${f.ext}`));
      for (const p of this[key].paths) if (p.startsWith('img/') && !wanted.has(p)) entries[key].push({ path: p, sha: null });
    }
    snap.files = files; snap.savedAt = Date.now();
    pub.files = {}; for (const [id, f] of Object.entries(files)) if (!f.priv) pub.files[id] = f.ext;
    const pubStr = JSON.stringify(pub);   // без времени сохранения: если открытая часть не менялась, её не трогаем
    const pubSame = !force && !entries.pub.length && pubStr === this.pubStr && !!this.pub.shas['public.json'];
    await this.commitDoc(this.prv, 'full.json', JSON.stringify(snap), entries.prv);
    if (!pubSame) { pub.savedAt = snap.savedAt; await this.commitDoc(this.pub, 'public.json', JSON.stringify(pub), entries.pub); this.pubStr = pubStr; }
    S.files = files;
  },
  /* Записывает файл с данными. Если меняется только он — одним запросом; если вместе с картинками — общей «пачкой». */
  async commitDoc(store, path, text, extra) {
    const sha = store.shas[path], message = 'Журнал: сохранение';
    if (!extra.length && sha) {
      try {
        const r = await GH.api('PUT', `${repoBase(store.t)}/contents/${path}`, { message, content: toB64(new TextEncoder().encode(text)), sha, branch: store.t.branch });
        store.at = { head: r.commit.sha, tree: r.commit.tree.sha }; store.shas[path] = r.content.sha; return;
      } catch (e) {
        if (!(e instanceof GhError) || e.status === 0 || e.status === 401 || e.status === 403) throw e;
        if (e.status === 409) { e.where = 'ref'; throw e; }
      }
    }
    const blob = await Git.blob(store.t, text);
    store.at = await Git.commit(store.t, store.at, [...extra, { path, sha: blob }], message);
    store.shas[path] = blob; store.paths.add(path);
    for (const e of extra) { if (e.sha) store.paths.add(e.path); else store.paths.delete(e.path); }
  },
  label() {
    if (this.status === 'ok') return `<span class="ok">✓ Всё сохранено в интернете</span>`;
    if (this.status === 'error') return `<b>Не сохранено.</b> ${esc(this.error)} <button class="textlink" data-act="sync-retry">${this.conflict ? 'Сохранить мою версию поверх' : 'Повторить'}</button>`;
    return 'Сохраняю…';
  },
  paint() { const el = $('#sync-status'); if (el) { el.innerHTML = this.label(); el.className = 'sync ' + this.status; } },
};
async function askConflict() {
  if (await confirmDialog('<b>Журнал изменили с другого устройства или вкладки</b>, пока вы работали здесь.<br><br>Безопаснее загрузить свежую версию — тогда ваши последние правки на этой странице пропадут. Либо закройте это окно и нажмите «Сохранить мою версию поверх» внизу слева.', 'Загрузить свежую версию', false)) location.reload();
}

const keyName = () => `cj-owner:${ONLINE.owner}/${ONLINE.repo}`.toLowerCase();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } };

async function loadOwner(token) {
  const c = ONLINE, p = privT(c); GH.token = token;
  try { await GH.api('GET', repoBase(p)); }
  catch (e) { if (e instanceof GhError && (e.status === 404 || e.status === 403)) throw new GhError(401, 'no access'); throw e; }
  Sync.cfg = c; Sync.prv = await Sync.open(p); Sync.pub = await Sync.open(pubT(c));
  let st = null;
  if (Sync.prv.paths.has('full.json')) st = JSON.parse(await GH.api('GET', `${repoBase(p)}/contents/full.json?ref=${p.branch}`, null, { raw: true }));
  else if (Sync.pub.paths.has('public.json')) {
    st = JSON.parse(await GH.api('GET', `${repoBase(pubT(c))}/contents/public.json?ref=${c.branch}`, null, { raw: true }));
    st.files = Object.fromEntries(Object.entries(st.files || {}).map(([id, ext]) => [id, { ext, priv: false }]));
  }
  S = normalize(st || blankState()); IMG = {};
  const hidden = [];
  for (const [id, f] of Object.entries(S.files)) { if (f.priv) hidden.push([id, f]); else IMG[id] = rawUrl(pubT(c), `img/${id}.${f.ext}`); }
  Sync.loading = (async () => {
    for (const [id, f] of hidden) {
      try { IMG[id] = dataUrl(await GH.api('GET', `${repoBase(p)}/contents/img/${id}.${f.ext}?ref=${p.branch}`, null, { raw: true, binary: true }), f.ext); }
      catch (e) { console.error(e); }
    }
    Sync.loading = null;
    if (hidden.length && $('#view')) render();
  })();
}
async function loadViewer() {
  const t = pubT(ONLINE); let text;
  try { text = await GH.api('GET', `${repoBase(t)}/contents/public.json?ref=${t.branch}`, null, { raw: true, anon: true }); }
  catch (e) {
    const res = await fetch(rawUrl(t, 'public.json'), { cache: 'no-store' }).catch(() => null);
    if (!res || !res.ok) throw e;
    text = await res.text();
  }
  const st = JSON.parse(text), files = st.files || {};
  S = normalize(st); IMG = {}; SHARED_AT = st.savedAt || null;
  for (const [id, ext] of Object.entries(files)) IMG[id] = rawUrl(t, `img/${id}.${ext}`);
}
let bootNote = '';
async function bootOnline() {
  const m = /[#&]owner=([^&]+)/.exec(location.hash);
  if (m) { lsSet(keyName(), decodeURIComponent(m[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
  const token = lsGet(keyName());
  if (token) {
    try { await loadOwner(token); OWNER = true; }
    catch (e) {
      if (!(e instanceof GhError) || e.status !== 401) throw e;
      lsSet(keyName(), null); GH.token = null; bootNote = 'Ключ владельца больше не подходит — войдите заново.';
    }
  }
  if (!OWNER) { await loadViewer(); READONLY = true; }
  const th = lsGet('cj-theme'); if (th && THEMES.some(t => t.id === th)) S.settings.theme = th;
}

async function publishGo() {
  const mode = $('input[name="pb-mode"]:checked');
  PB.token = $('#pb-token').value.trim(); PB.repo = $('#pb-repo').value.trim(); PB.touched = true; PB.replace = !!(mode && mode.value);

  if (PB.replace && !(await confirmDialog('<b>Записи на сайте будут заменены</b> записями из этого файла. То, что есть только на сайте, пропадёт.<br><br>Если не уверены, сначала откройте сайт как владелец и сохраните резервную копию кнопкой «В файл».', 'Заменить записи на сайте'))) return;
  const stages = ['Проверяю ключ', 'Готовлю место для сайта', 'Загружаю сайт', 'Загружаю записи и картинки', 'Включаю адрес сайта', 'Жду, пока сайт заработает'];

async function publish(token, name, ui, replace) {
  GH.token = token; ui.stage(0);
  const owner = (await GH.api('GET', '/user')).login;
  if (GH.scopes !== null && !(GH.scopes || '').split(',').map(x => x.trim()).includes('repo')) throw new Error('У ключа нет разрешения repo. Создайте ключ заново по ссылке из шага 2 и не снимайте галочку repo.');
  const url = `https://${owner.toLowerCase()}.github.io/${name}/`, privName = name + '-private';
  const getRepo = n => GH.api('GET', `/repos/${owner}/${n}`).catch(e => { if (e instanceof GhError && e.status === 404) return null; throw e; });
  const makeRepo = (n, priv) => GH.api('POST', '/user/repos', { name: n, private: priv, auto_init: true, description: priv ? 'Журнал кампаний: закрытая часть (не удалять)' : 'Журнал кампаний', homepage: priv ? undefined : url, has_issues: false, has_projects: false, has_wiki: false });
  ui.stage(1);
  let pubRepo = await getRepo(name), update = false;
  if (pubRepo) {
    update = await GH.api('GET', `/repos/${owner}/${name}/git/ref/heads/data`).then(() => true, e => { if (e instanceof GhError && [404, 409].includes(e.status)) return false; throw e; });
    if (!update) throw new Error(`На вашем GitHub уже есть хранилище «${name}», и это не журнал. Выберите другой адрес.`);
  } else pubRepo = await makeRepo(name, false);
  const privRepo = (await getRepo(privName)) || (await makeRepo(privName, true));
  const cfg = { owner, repo: name, branch: 'data', priv: privName, pb: privRepo.default_branch || 'main' };
  const site = { owner, repo: name, branch: pubRepo.default_branch || 'main' };
  ui.stage(2);
  const at = await retry(() => Git.headOf(site));
  const done = await Git.commit(site, at, [
    { path: 'index.html', sha: await Git.blob(site, pageHtml('Журнал кампаний', S.settings.theme, 'window.__ONLINE__ = ' + JSON.stringify(cfg) + ';')) },
    { path: '.nojekyll', sha: await Git.blob(site, '\n') },
    ...await Promise.all(Object.entries(window.__ASSETS__ || {}).map(async ([id, src]) => ({ path: `assets/${id}.jpg`, sha: await Git.blob(site, fromB64(src.slice(src.indexOf(',') + 1))) }))),
  ], update ? 'Обновление сайта журнала' : 'Сайт журнала');
  if (!update) await GH.api('POST', `/repos/${owner}/${name}/git/refs`, { ref: 'refs/heads/data', sha: done.head });
  await retry(() => Git.headOf(privT(cfg)));
  ui.stage(3);
  const data = !update || !!replace;
  if (data) {
    Sync.cfg = cfg; Sync.progress = (d, n) => ui.note(3, `— картинки: ${d} из ${n}`);

      body: 'Утром Илья сводил Веру в портовую контору. Журнал действительно испорчен, но на корешке остался оттиск: груз «Северины» принимал лично Аркадий Штольц — за два дня до того, как маяк закрыли.\n\nДнём поднялись на Серый мыс. Штольц открыл не сразу и говорил через цепочку. Про огонь сказал только: «Я его не зажигаю. Я его гашу».\n\n## Вопросы на следующую игру\n\n- Что было в ящиках и почему их отвезли на маяк?\n- От кого Илья получил письмо, из-за которого вернулся?\n- Кто стоял на галерее, пока Штольц разговаривал с нами у двери?\n\nВечером в «Якоре» Вере передали записку без подписи: *«Уезжайте, пока ходит катер»*.' },
  );
  st.notes.push(
    { ...base, id: 'demo-n1', title: 'Договорённости группы', pinned: true, body: '- Играем по субботам, раз в две недели.\n- Заметки после игры пишет тот, чей персонаж был в центре событий.\n- Спорные моменты обсуждаем после сессии, а не во время.' },
    { ...base, id: 'demo-n2', title: 'Идеи и догадки', pinned: false, body: 'Зелёный свет — сигнал не кораблям, а кому-то на берегу?\n\nПроверить, кто владел «Севериной» до прошлой весны.' },
  );
  return st;
}

/* ═════════ Запуск ═════════ */
async function boot() {
  const shared = window.__SHARED__;
  let ok = false, st = null;
  if (shared && shared.state && shared.state.campaigns && shared.state.campaigns.length) {
    READONLY = true; SHARED_AT = shared.sharedAt || null;
    S = normalize(shared.state); IMG = shared.images || {};
    document.title = S.campaigns[0].name;
  } else if (ONLINE) {
    try { await bootOnline(); }
    catch (e) {
      console.error(e);
      return fatal('Журнал не загрузился', e instanceof GhError && e.status === 404 ? 'Записи журнала не найдены. Если сайт только что опубликован, подождите минуту и попробуйте ещё раз.' : esc(ghMessage(e)));
    }
    if (campaign()) document.title = campaign().name + ' — журнал кампании';
  } else {
    ok = await Store.init(); MEM = !ok;
    if (ok) { try { st = await Store.get('kv', 'state'); IMG = await Store.allImages(); } catch (e) { st = null; } }
    if (st) S = normalize(st);
    else {
      S = demoState(); IMG = Object.assign({}, window.__DEMO_IMAGES__ || {});
      if (ok) { for (const [id, v] of Object.entries(IMG)) Store.put('img', id, v); Store.put('kv', 'state', S); }
    }
    if (ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  applyTheme();
  $('#app').innerHTML = `
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="bgimg" id="bgimg"></div>
      <header class="topbar">
        <div class="search">${ic('search')}<input id="search-in" type="text" placeholder="Поиск по кампании" autocomplete="off" aria-label="Поиск по кампании"><kbd>Ctrl K</kbd><div class="search-results" id="search-results" hidden></div></div>
        <span class="spacer"></span>
        ${READONLY ? '' : `<button class="btn primary" data-act="create-menu">${ic('plus')}Добавить</button>`}
        <button class="icon-btn only-narrow" data-act="more-menu" aria-label="Оформление и другие действия" title="Оформление и другие действия">${ic('dots')}</button>
      </header>
      <div id="notice"></div>
      <div class="scroll" id="scroll"><div class="view" id="view"></div></div>
    </div>`;
  route = parsePath(location.hash);
  render(true);
  if (bootNote) toast(bootNote, 6000);
  if (ONLINE && !OWNER) setInterval(() => { if (route.view === 'board' && !document.hidden) refreshViewer(false); }, 120000);   // зрителю доска сама подтягивает свежую версию
}
boot();
})();

</script>
