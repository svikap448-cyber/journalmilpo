<html lang="ru" data-theme="midnight">
<head>

<style id="app-css">
/* ───────── Темы ───────── */
:root, [data-theme="midnight"] {
  --bg: #13121a; --surface: #1c1b26; --surface-2: #262433; --border: #353245;
  --text: #ece7db; --muted: #9c96aa; --accent: #d6ab5c; --accent-ink: #1b1406;
  --accent-soft: rgba(214,171,92,.14); --danger: #e0685e; --ok: #7fbf8f;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-head: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: Georgia, "Palatino Linotype", "Times New Roman", serif;
  --radius: 10px; --head-spacing: .01em; --head-case: none;
}
[data-theme="parchment"] {
  --bg: #ece2cd; --surface: #f7f0df; --surface-2: #e6d9bd; --border: #d0bf9c;
  --text: #32281b; --muted: #7b6b53; --accent: #8a3a28; --accent-ink: #fff7ea;
  --accent-soft: rgba(138,58,40,.11); --danger: #a8322a; --ok: #4d7a4f;
  --shadow: 0 10px 28px rgba(80,55,20,.22);
}
[data-theme="noir"] {
  --bg: #0d0d0e; --surface: #161618; --surface-2: #212124; --border: #303035;
  --text: #e8e8e6; --muted: #8d8d94; --accent: #cf463d; --accent-ink: #fff;
  --accent-soft: rgba(207,70,61,.15); --danger: #e06a62; --ok: #86b894;
  --font-head: Georgia, "Times New Roman", serif;
  --radius: 4px;
}
[data-theme="neon"] {
  --bg: #090c1a; --surface: #10142c; --surface-2: #181d40; --border: #2a3168;
  --text: #dee5ff; --muted: #8590c4; --accent: #3de3c2; --accent-ink: #04201a;
  --accent-soft: rgba(61,227,194,.13); --danger: #ff6b9a; --ok: #3de3c2;
  --font-head: Consolas, "Cascadia Mono", "SF Mono", Menlo, monospace;
  --font-read: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --radius: 3px; --head-spacing: .04em; --head-case: uppercase;
}

/* ───────── Основа ───────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; margin: 0; letter-spacing: var(--head-spacing); text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.15; }
h2 { font-size: 21px; line-height: 1.25; }
h3 { font-size: 17px; line-height: 1.3; }
[data-theme="neon"] h1 { font-size: 28px; text-transform: uppercase; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; max-width: 100%; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--accent-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 100vh; }

/* ───────── Боковая панель ───────── */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { margin: 14px 12px 6px; padding: 10px 12px; border-radius: var(--radius); display: flex; align-items: center; gap: 10px; text-align: left; width: calc(100% - 24px); border: 1px solid var(--border); background: var(--bg); }
.brand:hover { border-color: var(--accent); }
.brand-text { min-width: 0; flex: 1; }
.brand-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.brand-name { font-family: var(--font-head); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand svg { color: var(--muted); }

.nav { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius); color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .8; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 4px; }

.side-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.foot-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.theme-sw { height: 30px; border-radius: 6px; border: 2px solid transparent; position: relative; overflow: hidden; }
.theme-sw span { position: absolute; inset: 0; }
.theme-sw i { position: absolute; right: 5px; bottom: 5px; width: 9px; height: 9px; border-radius: 50%; }
.theme-sw.on { border-color: var(--accent); }
.theme-sw:hover { transform: translateY(-1px); }
.backup { display: flex; gap: 6px; }
.backup button { flex: 1; }
.backup-note { font-size: 12px; color: var(--muted); line-height: 1.35; }
.backup-note.warn { color: var(--accent); }

/* ───────── Кнопки ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); font-weight: 600; font-size: 14px; white-space: nowrap; transition: border-color .12s, background .12s, transform .08s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; }
.btn.danger:hover { border-color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.sm svg.i { width: 15px; height: 15px; }
.icon-btn { width: 34px; height: 34px; border-radius: var(--radius); display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ───────── Основная область ───────── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 32px; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; z-index: 5; }
.search { position: relative; flex: 1; max-width: 460px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 9px 60px 9px 38px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 11px var(--font-body); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; padding: 6px; }
.sr { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; }
.sr:hover, .sr.cur { background: var(--accent-soft); }
.sr svg { color: var(--muted); }
.sr-t { font-weight: 600; }
.sr-s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr > div { min-width: 0; }
.sr-empty { padding: 14px; color: var(--muted); text-align: center; }
.topbar .spacer { flex: 1; }

.notice { margin: 0; padding: 10px 32px; background: var(--accent-soft); border-bottom: 1px solid var(--border); font-size: 13.5px; display: flex; gap: 10px; align-items: center; }
.notice b { color: var(--accent); }

.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.view { max-width: 1120px; margin: 0 auto; padding: 28px 32px 80px; }

.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
.back:hover { color: var(--accent); }
.back svg.i { width: 15px; height: 15px; }

.tabs { display: flex; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.tabs button { padding: 5px 12px; border-radius: calc(var(--radius) - 3px); color: var(--muted); font-weight: 500; font-size: 13.5px; }
.tabs button.on { background: var(--surface-2); color: var(--text); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card.pad { padding: 20px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-head h2, .card-head h3 { flex: 1; }
.more { font-size: 13px; color: var(--accent); font-weight: 600; }
.more:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ───────── Обзор ───────── */
.hero { position: relative; border-radius: calc(var(--radius) + 4px); overflow: hidden; min-height: 300px; display: flex; align-items: flex-end; border: 1px solid var(--border); background: var(--surface); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,8,12,.92) 0%, rgba(8,8,12,.55) 45%, rgba(8,8,12,.05) 100%); }
.hero.plain::after { display: none; }
.hero-body { position: relative; z-index: 1; padding: 28px 32px; max-width: 760px; color: #f3efe6; }
.hero.plain .hero-body { color: var(--text); }
.hero-body h1 { font-size: 42px; margin: 6px 0 10px; }
[data-theme="neon"] .hero-body h1 { font-size: 34px; }
.hero-body p { opacity: .88; font-size: 15.5px; line-height: 1.55; }
.hero .eyebrow { color: #e9c98a; }
.hero.plain .eyebrow { color: var(--accent); }
.hero-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.hero:not(.plain) .btn:not(.primary) { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; backdrop-filter: blur(6px); }

.demo-note { margin-top: 16px; padding: 12px 16px; border: 1px dashed var(--accent); border-radius: var(--radius); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); }
.demo-note p { flex: 1; min-width: 260px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
.stat { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.stat:hover { border-color: var(--accent); }
.stat svg { color: var(--accent); width: 22px; height: 22px; }
.stat b { font-family: var(--font-head); font-size: 24px; line-height: 1; display: block; }
.stat span { font-size: 12.5px; color: var(--muted); }

.home-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.recap h3 { font-size: 22px; margin: 4px 0 2px; }
.recap .prose { margin-top: 12px; }
.fade { max-height: 250px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }

.mini-list { display: flex; flex-direction: column; }
.mini { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); }
.mini:first-child { border-top: 0; padding-top: 0; }
.mini:last-child { padding-bottom: 0; }
.mini:hover .mini-t { color: var(--accent); }
.mini-t { font-weight: 600; }
.mini > div { min-width: 0; flex: 1; }
.mini .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

/* ───────── Статусы и чипы ───────── */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.pill.open { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill.done { color: var(--ok); border-color: currentColor; }
.pill.dead { color: var(--danger); border-color: currentColor; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 4px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); font-size: 13.5px; font-weight: 500; }
.chip.noav { padding-left: 11px; }
.chip:hover { border-color: var(--accent); }
.chip svg.i { width: 14px; height: 14px; color: var(--muted); }

.av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--border); overflow: hidden; }
.av.md { width: 44px; height: 44px; font-size: 15px; }
.av.lg { width: 56px; height: 56px; font-size: 18px; }
.av-stack { display: flex; }
.av-stack .av { margin-left: -7px; border: 2px solid var(--surface); }
.av-stack .av:first-child { margin-left: 0; }

/* ───────── Сессии ───────── */
.timeline { position: relative; display: flex; flex-direction: column; gap: 12px; }
.timeline::before { content: ""; position: absolute; left: 25px; top: 10px; bottom: 10px; width: 1px; background: var(--border); }
.s-row { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px; align-items: start; }
.s-num { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font-family: var(--font-head); font-size: 19px; font-weight: 600; color: var(--accent); position: relative; z-index: 1; }
.s-card { padding: 16px 20px; display: block; transition: border-color .12s, transform .12s; }
.s-row:hover .s-card { border-color: var(--accent); transform: translateX(2px); }
.s-row:hover .s-num { border-color: var(--accent); }
.s-card h3 { font-size: 19px; }
.s-meta { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 2px; flex-wrap: wrap; }
.s-card p { margin-top: 8px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.s-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }

.detail { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 28px; align-items: start; }
.detail.left { grid-template-columns: 300px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; }
.side h4 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.side .card { padding: 16px; }
.who { display: flex; gap: 11px; align-items: center; padding: 6px; margin: 0 -6px; border-radius: 8px; }
.who:hover { background: var(--surface-2); }
.who b { display: block; font-weight: 600; line-height: 1.25; }
.who span { font-size: 12.5px; color: var(--muted); display: block; line-height: 1.3; }
.who > div { min-width: 0; }
.link-row { display: flex; gap: 9px; align-items: center; padding: 6px; margin: 0 -6px; border-radius: 8px; font-weight: 500; }
.link-row:hover { background: var(--surface-2); color: var(--accent); }
.link-row svg { color: var(--muted); }
.link-row .pill { margin-left: auto; }

.prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.prevnext a { padding: 14px 16px; }
.prevnext a:hover { border-color: var(--accent); }
.prevnext a:last-child { text-align: right; grid-column: 2; }
.prevnext small { color: var(--muted); display: block; font-size: 12px; }
.prevnext b { font-family: var(--font-head); font-size: 16px; }

.section { margin-top: 30px; }
.section > h2 { margin-bottom: 12px; }

/* ───────── Текст ───────── */
.prose { font-family: var(--font-read); font-size: 17px; line-height: 1.72; max-width: 70ch; overflow-wrap: break-word; }
.prose.sm { font-size: 15.5px; line-height: 1.62; }
.prose > * + * { margin-top: .85em; }
.prose h2, .prose h3 { margin-top: 1.5em; }
.prose > :first-child { margin-top: 0; }
.prose ul { margin: .85em 0 0; padding-left: 1.3em; }
.prose li + li { margin-top: .3em; }
.prose blockquote { margin: 1em 0 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic; }
.prose hr { border: 0; height: 1px; background: var(--border); margin: 1.6em 0; }
.prose a.ref { color: var(--accent); border-bottom: 1px dotted currentColor; }
.prose a.ref:hover { border-bottom-style: solid; background: var(--accent-soft); }

/* ───────── Сетки карточек ───────── */
.grid { display: grid; gap: 16px; }
.grid.people { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.places { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.notes { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.shots { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }

.p-card { overflow: hidden; display: block; transition: transform .14s, border-color .14s; }
.p-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.p-img { aspect-ratio: 4 / 5; background: var(--surface-2); position: relative; display: grid; place-items: center; overflow: hidden; }
.places .p-img { aspect-ratio: 16 / 10; }
.p-img img { width: 100%; height: 100%; object-fit: cover; }
.p-img .ph { font-family: var(--font-head); font-size: 52px; color: var(--border); }
.p-img .ph svg { width: 44px; height: 44px; color: var(--border); }
.p-img .pill { position: absolute; top: 10px; left: 10px; background: var(--surface); }
.p-body { padding: 12px 14px 14px; }
.p-body h3 { font-size: 17px; }
.p-body p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.p-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; margin-bottom: 2px; }

.n-card { padding: 16px 18px; display: block; }
.n-card:hover { border-color: var(--accent); }
.n-card h3 { display: flex; gap: 8px; align-items: center; }
.n-card h3 .star svg { color: var(--accent); width: 15px; height: 15px; fill: currentColor; }
.n-card p { color: var(--muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

.t-group { margin-bottom: 26px; }
.t-group > h2 { font-size: 13px; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 10px; }
.t-row { display: flex; gap: 14px; padding: 16px 18px; margin-bottom: 10px; align-items: flex-start; }
.t-row:hover { border-color: var(--accent); }
.t-row > svg { color: var(--accent); margin-top: 3px; }
.t-row > div { flex: 1; min-width: 0; }
.t-row p { color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-row .right { flex: none; text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

.portrait { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); aspect-ratio: 4 / 5; display: grid; place-items: center; }
.portrait img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.portrait .ph { font-family: var(--font-head); font-size: 90px; color: var(--border); }
.facts { display: grid; gap: 10px; }
.facts div span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts div b { font-weight: 500; }

const Store = {
  db: null,
  init() {
    return new Promise(res => {
      const t = setTimeout(() => res(false), 2500);
      const done = v => { clearTimeout(t); res(v); };
      try {
        const rq = indexedDB.open('chronicle-journal', 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); rq.result.createObjectStore('img'); };
        rq.onsuccess = () => { this.db = rq.result; done(true); };
        rq.onerror = () => done(false);
        rq.onblocked = () => done(false);
      } catch (e) { done(false); }
    });
  },
  req(store, mode, fn) {
    if (!this.db) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      try {
        const tx = this.db.transaction(store, mode); const out = fn(tx.objectStore(store));
        tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
      } catch (e) { rej(e); }
    });
  },
  get(store, key) { return this.req(store, 'readonly', s => s.get(key)); },
  put(store, key, val) { return this.req(store, 'readwrite', s => s.put(val, key)).catch(storeError); },
  del(store, key) { return this.req(store, 'readwrite', s => s.delete(key)).catch(storeError); },
  clear(store) { return this.req(store, 'readwrite', s => s.clear()).catch(storeError); },
  allImages() {
    if (!this.db) return Promise.resolve({});
    return new Promise(res => {
      const out = {}; const rq = this.db.transaction('img', 'readonly').objectStore('img').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    });
  },
};

/* ═════════ Оформление текста и автоссылки ═════════ */
const NOUN_END = '(?:а|я|ы|и|е|у|ю|о|ой|ей|ёй|ою|ею|ом|ем|ём|ым|им|ь|ью|й|ов|ев|ам|ям|ах|ях|ами|ями)?';
const ADJ_END = '(?:ий|ый|ой|ая|яя|ое|ее|ие|ые|ого|его|ому|ему|ым|им|ом|ем|ую|юю|ей|ых|их|ыми|ими|ия|ию|ием|ии)';
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function wordRe(w) {
  if (!/^[А-Яа-яЁё]+$/.test(w) || w.length < 3) return rx(w);
  let body, end;
  if (w.length >= 5 && /(ий|ый|ой|ая|яя|ое|ее|ие|ые)$/.test(w)) { body = w.slice(0, -2); end = ADJ_END; }
  else if (w.length >= 4 && /[аяоеуюыийь]$/.test(w)) { body = w.slice(0, -1); end = NOUN_END; }
  else { body = w; end = NOUN_END; }
  const f = body[0], lower = f === f.toLowerCase();
  return (lower ? `[${f}${f.toUpperCase()}]` : rx(f)) + rx(body.slice(1)) + end;
}
const termRe = name => esc(name).split(/\s+/).map(wordRe).join('\\s+');

let _al = null, _alKey = '';
function autolinker() {
  const key = rev + '|' + cid();
  if (key === _alKey) return _al;
  _alKey = key; _al = null;
  const terms = [];
  for (const type of ['characters', 'locations']) for (const e of list(type)) {
    const names = [e.name, ...String(e.aliases || '').split(',')].map(x => x.trim()).filter(x => x.length >= 2);
    for (const n of names) terms.push({ type, id: e.id, src: termRe(n), len: n.length });
  }
  if (!terms.length) return null;
  terms.sort((a, b) => b.len - a.len);
  const L = 'A-Za-zА-Яа-яЁё0-9';
  try { _al = { items: terms, re: new RegExp(`(?<![${L}])(?:${terms.map(t => '(' + t.src + ')').join('|')})(?![${L}])`, 'g') }; } catch (e) { _al = null; }
  return _al;
}
function inline(s, selfId) {
  let h = esc(s); const refs = []; const al = autolinker();
  if (al) h = h.replace(al.re, (m, ...g) => {
    let it = null;
    for (let i = 0; i < al.items.length; i++) if (g[i] !== undefined) { it = al.items[i]; break; }
    if (!it || it.id === selfId) return m;
    refs.push(`<a class="ref" ${nav(it.type + '/' + it.id)}>${m}</a>`);
    return '\u0001' + (refs.length - 1) + '\u0002';
  });
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  return h.replace(/\u0001(\d+)\u0002/g, (m, i) => refs[+i]);
}
function rich(text, selfId) {
  const out = []; let listBuf = [], quote = [];
  const flush = () => {
    if (listBuf.length) { out.push('<ul>' + listBuf.map(l => '<li>' + inline(l, selfId) + '</li>').join('') + '</ul>'); listBuf = []; }
    if (quote.length) { out.push('<blockquote>' + quote.map(l => inline(l, selfId)).join('<br>') + '</blockquote>'); quote = []; }
  };
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const l = raw.trim(); let m;
    if (!l) { flush(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { flush(); out.push(`<h${m[1].length === 1 ? 2 : 3}>${inline(m[2], selfId)}</h${m[1].length === 1 ? 2 : 3}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(l)) { flush(); out.push('<hr>'); continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { if (quote.length) flush(); listBuf.push(m[1]); continue; }
    if ((m = l.match(/^>\s?(.*)/))) { if (listBuf.length) flush(); quote.push(m[1]); continue; }
    flush(); out.push('<p>' + inline(l, selfId) + '</p>');
  }
  flush();
  return out.join('');
}

      <section class="card pad"><div class="card-head"><h3>Открытые сюжетные линии</h3><a class="more" ${nav('threads')}>Все →</a></div>
        ${threads.length ? `<div class="mini-list">${threads.slice(0, 6).map(t => `<a class="mini" ${nav('threads/' + t.id)}>${ic('thread')}<div><div class="mini-t">${esc(t.title)}</div><div class="small muted">${esc(cut(t.body, 70))}</div></div></a>`).join('')}</div>` : '<p class="muted small">Тайны, конфликты и вопросы без ответа, за которыми стоит следить.</p>'}
      </section>

        ${pinned.length ? `<div class="mini-list">${pinned.map(n => `<a class="mini" ${nav('notes/' + n.id)}>${ic('note')}<div><div class="mini-t">${esc(n.title)}</div><div class="small muted">${esc(cut(n.body, 70))}</div></div></a>`).join('')}</div>` : '<p class="muted small">Закрепите заметку — например, договорённости группы, — и она будет под рукой.</p>'}

}

function head(type, sub, extra = '') {
  return `<div class="page-head"><div><h1>${TYPES[type].many}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="actions">${extra}${newBtn(type)}</div></div>`;
}
const countSub = (type, n) => `${n} ${plural(n, TYPES[type].forms)}`;

function viewSessions() {
  const asc = S.settings.sessionsAsc, ses = sessionsSorted(asc);
  if (!ses.length) return head('sessions') + empty('book', 'Пока ни одной сессии', 'После игры запишите, что произошло, и отметьте, кто участвовал. Со временем здесь сложится вся история кампании.', newBtn('sessions', 'Записать первую сессию'));
  return head('sessions', countSub('sessions', ses.length), `<div class="tabs"><button class="${asc ? '' : 'on'}" data-act="sort" data-v="0">Сначала новые</button><button class="${asc ? 'on' : ''}" data-act="sort" data-v="1">Сначала старые</button></div>`)
    + `<div class="timeline">${ses.map(sessionRow).join('')}</div>`;
}

function detailHead(type, e, eyebrow, title, sub) {

  <div class="page-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h1>${esc(title)}</h1>${sub || e.secret ? `<div class="sub">${sub || ''} ${lockPill(e)}</div>` : ''}</div>

}
const proseOr = (text, selfId, hint) => text && text.trim() ? `<div class="prose">${rich(text, selfId)}</div>` : `<p class="muted">${ro(hint, 'Пока ничего не записано.')}</p>`;

function viewSession(s) {

  <div class="detail"><div>
    ${proseOr(s.body, null, 'Текст пока не записан. Нажмите «Изменить», чтобы добавить.')}
    ${imgs.length ? `<div class="section"><h2>Картинки</h2>${shots('sessions/' + s.id, imgs)}</div>` : ''}
    <div class="prevnext">${prev ? `<a class="card" ${nav('sessions/' + prev.id)}><small>← Предыдущая · ${esc(prev.number)}</small><b>${esc(sTitle(prev))}</b></a>` : ''}${next ? `<a class="card" ${nav('sessions/' + next.id)}><small>Следующая · ${esc(next.number)} →</small><b>${esc(sTitle(next))}</b></a>` : ''}</div>

function viewCharacters() {

function viewThreads() {
  const all = list('threads');
  if (!all.length) return head('threads') + empty('thread', 'Сюжетных линий пока нет', 'Тайны, конфликты, обещания, вопросы без ответа. Отмечайте их в сессиях — и у каждой линии сама соберётся история развития.', newBtn('threads', 'Добавить линию'));

    }).join('')}</div>`;
  };
  return head('threads', countSub('threads', all.length)) + group('open', 'Открытые') + group('dormant', 'Затихшие') + group('done', 'Завершённые');

function viewThread(t) {
  const ses = sessionsWith('threads', t.id), chars = pick('characters', t.characters);
  return detailHead('threads', t, 'Сюжетная линия', t.title, threadPill(t)) + `
  <div class="detail"><div>
    ${proseOr(t.body, null, 'Описания пока нет.')}
    <div class="section"><h2>Как развивалась</h2>${ses.length ? `<div class="timeline">${ses.map(sessionRow).join('')}</div>` : `<p class="muted">${ro('Эта линия ещё не отмечена ни в одной сессии. Отметить можно при редактировании сессии.', 'Эта линия ещё не отмечена ни в одной сессии.')}</p>`}</div>
  </div><aside class="side">${chars.length ? `<div class="card"><h4>Кто замешан</h4>${chars.map(whoRow).join('')}</div>` : `<div class="card"><h4>Кто замешан</h4><p class="muted small">Никто не отмечен.</p></div>`}</aside></div>`;
}

function viewNotes() {
  const all = list('notes').sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
  if (!all.length) return head('notes') + empty('note', 'Заметок пока нет', 'Всё, что не привязано к конкретной игре: договорённости группы, идеи, правила, списки.', newBtn('notes', 'Написать заметку'));
  return head('notes', countSub('notes', all.length)) + `<div class="grid notes">${all.map(n => `<a class="card n-card" ${nav('notes/' + n.id)}><h3>${n.pinned ? `<span class="star">${ic('star')}</span>` : ''}${esc(n.title)}${lock(n)}</h3><p>${esc(cut(n.body, 260))}</p></a>`).join('')}</div>`;
}
const viewNote = n => detailHead('notes', n, n.pinned ? 'Закреплённая заметка' : 'Заметка', n.title) + proseOr(n.body, null, 'Пусто.');

function viewGallery() {
  const items = imageSet('gallery');
  const h = `<div class="page-head"><div><h1>Галерея</h1><div class="sub">${items.length ? `${items.length} ${plural(items.length, ['картинка', 'картинки', 'картинок'])} со всей кампании` : ''}</div></div></div>`;
  if (!items.length) return h + empty('image', 'Картинок пока нет', 'Сюда автоматически попадают все изображения: портреты персонажей, виды мест, картинки из сессий и обложка.', '');

function viewWelcome() {
  return `<div class="welcome"><h1>Журнал кампаний</h1><p>Здесь будут заметки о сессиях, персонажи с портретами, места и сюжетные линии. Начните с названия вашей игры.</p><button class="btn primary" data-act="new-campaign">${ic('plus')}Создать кампанию</button></div>`;
}

const DETAIL = { sessions: viewSession, characters: viewCharacter, locations: viewLocation, threads: viewThread, notes: viewNote };
const LIST = { sessions: viewSessions, characters: viewCharacters, locations: viewLocations, threads: viewThreads, notes: viewNotes, gallery: viewGallery, home: viewHome };

/* ═════════ Отрисовка ═════════ */
function footHtml(c) {
  const backup = `<div><div class="foot-label">Резервная копия</div><div class="backup"><button class="btn sm" data-act="export" title="Сохранить все данные в файл">${ic('download')}В файл</button><button class="btn sm" data-act="import" title="Загрузить данные из файла">${ic('upload')}Из файла</button></div>${backupNote()}</div>`;
  if (READONLY && !ONLINE) return `<div class="backup-note">${ic('lock')} Версия для чтения${SHARED_AT ? `<br>Обновлено ${fmtDate(dayOf(SHARED_AT))}` : ''}</div>`;
  if (READONLY) return `<div class="backup-note">${ic('lock')} Вы читаете журнал${SHARED_AT ? `<br>Обновлён ${fmtDate(dayOf(SHARED_AT))}` : ''}</div><button class="textlink" data-act="owner-login">Войти как владелец</button>`;
  if (ONLINE) return `<div class="sync ${Sync.status}" id="sync-status">${Sync.label()}</div><button class="btn sm" data-act="copy-link" title="Скопировать адрес сайта, чтобы отправить другим">${ic('share')}Ссылка для других</button>${backup}<button class="textlink" data-act="owner-logout">Выйти на этом устройстве</button>`;
  return `<button class="btn sm" data-act="publish" title="Сделать журнал сайтом со своим адресом">${ic('globe')}${S.settings.published ? 'Сайт в интернете' : 'Опубликовать в интернете'}</button>
      ${c ? `<button class="btn sm" data-act="share" title="Создать файл, который можно отправить другим">${ic('share')}Отправить файлом</button>` : ''}${backup}`;
}
function renderSidebar() {
  const c = campaign();
  const item = (view, icon, label, count) => `<a class="${route.view === view ? 'on' : ''}" ${nav(view)}>${ic(icon)}<span>${label}</span>${count ? `<span class="count">${count}</span>` : ''}</a>`;
  const types = Object.keys(TYPES).filter(t => !(READONLY && t === 'notes' && !list('notes').length));
  const brand = `<div class="brand-text"><div class="brand-label">Кампания</div><div class="brand-name">${esc(c ? c.name : 'Не выбрана')}</div></div>`;
  $('#sidebar').innerHTML = `
    ${READONLY && S.campaigns.length < 2 ? `<div class="brand">${brand}</div>` : `<button class="brand" data-act="campaign-menu">${brand}${ic('down')}</button>`}
    <nav class="nav">${c ? item('home', 'home', 'Обзор') + types.map(t => item(t, TYPES[t].icon, TYPES[t].many, list(t).length)).join('') + '<div class="nav-sep"></div>' + item('gallery', 'image', 'Галерея') : ''}</nav>
    <div class="side-foot">
      <div><div class="foot-label">Оформление</div><div class="themes">${THEMES.map(t => `<button class="theme-sw ${S.settings.theme === t.id ? 'on' : ''}" data-act="theme" data-v="${t.id}" title="${t.name}" aria-label="Тема «${t.name}»"><span style="background:${t.bg}"></span><i style="background:${t.ac}"></i></button>`).join('')}</div></div>
      ${footHtml(c)}
    </div>`;
  const n = $('#notice');
  if (n) {
    const p = !ONLINE && !READONLY && S.settings.published;
    n.innerHTML = p ? `<div class="notice"><span><b>Этот журнал опубликован в интернете.</b> Записи ведите на сайте <a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a> — изменения в этом файле туда не попадут.</span></div>`
      : MEM ? `<div class="notice"><span><b>Режим предпросмотра.</b> Здесь можно всё попробовать, но изменения не сохранятся. Скачайте файл и откройте его в браузере на своём компьютере — тогда всё будет сохраняться.</span></div>` : '';
  }
}
function backupNote() {
  if (MEM || ONLINE) return '';
  const lb = S.settings.lastBackup, ch = S.settings.changedAt;
  if (!lb) return ch ? `<div class="backup-note warn" style="margin-top:6px">Копия ещё ни разу не сохранялась</div>` : '';
  const days = Math.floor((Date.now() - lb) / 864e5);
  const when = days === 0 ? 'сегодня' : days === 1 ? 'вчера' : `${days} ${plural(days, ['день', 'дня', 'дней'])} назад`;
  return `<div class="backup-note ${ch > lb && days >= 7 ? 'warn' : ''}" style="margin-top:6px">Последняя копия: ${when}</div>`;
}
function renderView(resetScroll) {
  const sc = $('#scroll'), top = sc.scrollTop;
  let html;
  if (!campaign()) html = viewWelcome();
  else if (route.id) {
    const e = byId(route.view, route.id);
    if (e && e.campaignId === cid() && DETAIL[route.view]) html = DETAIL[route.view](e);
    else { route = { view: LIST[route.view] ? route.view : 'home', id: null }; html = LIST[route.view](); }
  } else html = (LIST[route.view] || viewHome)();
  $('#view').innerHTML = html;
  sc.scrollTop = resetScroll ? 0 : top;
}
function render(resetScroll) { renderSidebar(); renderView(resetScroll); }
function applyTheme() { document.documentElement.dataset.theme = S.settings.theme; }

function parsePath(p) { const [view, id] = String(p || '').replace(/^#?\/?/, '').split('/'); return { view: LIST[view] ? view : 'home', id: id || null }; }
function go(path, replace) {
  route = parsePath(path);
  try { history[replace ? 'replaceState' : 'pushState'](null, '', '#/' + path); } catch (e) { /* в предпросмотре адрес менять нельзя — не страшно */ }
  closeMenu(); closeSearch(); closeLightbox();
  render(true);
}
window.addEventListener('popstate', () => { if (!S) return; route = parsePath(location.hash); closeMenu(); closeLightbox(); render(true); });

/* ═════════ Всплывающие элементы ═════════ */
function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), ms);
}
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, html, alignRight) {
  closeMenu();
  menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.innerHTML = html;
  document.body.append(menuEl);
  const r = anchor.getBoundingClientRect(), w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  let left = alignRight ? r.right - w : r.left; left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = r.bottom + 6; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  menuEl.style.left = left + 'px'; menuEl.style.top = top + 'px';
  if (!alignRight) menuEl.style.minWidth = Math.max(230, r.width) + 'px';
}
function confirmDialog(text, okLabel = 'Удалить', danger = true) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'backdrop'; el.dataset.confirm = '1';

function pickFiles(accept, multiple) {

    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiple; inp.style.display = 'none';
    inp.addEventListener('change', () => { res([...inp.files]); inp.remove(); });

function processImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const src = fr.result, im = new Image(); im.onerror = () => rej(new Error('decode'));
      im.onload = () => {
        const MAX = 1600, sc = Math.min(1, MAX / Math.max(im.width, im.height));
        if (sc === 1 && file.size < 350000) return res(src);
        const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        const g = c.getContext('2d'); g.fillStyle = '#1c1b26'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.86));
      };
      im.src = src;
    };
    fr.readAsDataURL(file);
  });
}

  }

}

  let rep, cs, ce;
  if (kind === 'bold' || kind === 'italic') {
    const m = kind === 'bold' ? '**' : '*', inner = sel || (kind === 'bold' ? 'жирный текст' : 'курсив');
    rep = m + inner + m; cs = s + m.length; ce = cs + inner.length;
    ta.setRangeText(rep, s, e, 'select'); ta.setSelectionRange(cs, ce);
  } else {

}

/* ═════════ Сайт в интернете (хранится на GitHub) ═════════ */
class GhError extends Error { constructor(status, message, where) { super(message || ''); this.status = status; this.where = where; } }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const GH = {
  token: null, scopes: null,
  async api(method, path, body, o = {}) {
    const headers = { Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    if (this.token && !o.anon) headers.Authorization = 'Bearer ' + this.token;
    if (body) headers['Content-Type'] = 'application/json';
    let res;
    try { res = await fetch('https://api.github.com' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
    catch (e) { throw new GhError(0, 'network'); }
    if (path === '/user') this.scopes = res.headers.get('x-oauth-scopes');
    if (!res.ok) { let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) { /* без текста */ } throw new GhError(res.status, msg); }
    if (res.status === 204) return null;
    if (o.raw) return o.binary ? new Uint8Array(await res.arrayBuffer()) : res.text();
    return res.json();
  },
};
function ghMessage(e) {
  if (!(e instanceof GhError)) return 'Что-то пошло не так: ' + ((e && e.message) || e);
  if (e.status === 0) return 'Нет связи с GitHub. Проверьте интернет. Если интернет есть — возможно, GitHub сейчас недоступен у вашего провайдера; попробуйте позже.';
  if (e.status === 401) return 'Ключ не подошёл: он введён с ошибкой, удалён или истёк.';
  if (e.status === 403 && /rate limit/i.test(e.message)) return 'GitHub временно ограничил число запросов. Подождите несколько минут и попробуйте снова.';
  if (e.status === 403) return 'GitHub отказал в доступе: у ключа не хватает разрешений' + (e.message ? ' (' + e.message + ')' : '') + '.';
  if (e.status === 404) return 'GitHub не нашёл хранилище журнала. Возможно, оно удалено или ключ к нему не подходит.';
  return 'GitHub не принял запрос (' + e.status + (e.message ? ': ' + e.message : '') + ').';
}
async function retry(fn, tries = 12, ms = 1500) {
  for (let i = 0; ; i++) {

    catch (e) { if (i >= tries - 1 || !(e instanceof GhError) || ![404, 409, 422].includes(e.status)) throw e; await sleep(ms); }
  }
}
const repoBase = t => `/repos/${t.owner}/${t.repo}`;
const rawUrl = (t, path) => `https://raw.githubusercontent.com/${t.owner}/${t.repo}/${t.branch}/${path}`;
const pubT = c => ({ owner: c.owner, repo: c.repo, branch: c.branch });
const privT = c => ({ owner: c.owner, repo: c.priv, branch: c.pb || 'main' });

  const src = IMG[id];

const Git = {
  async headOf(t) {
    const ref = await GH.api('GET', `${repoBase(t)}/git/ref/heads/${t.branch}`);
    const commit = await GH.api('GET', `${repoBase(t)}/git/commits/${ref.object.sha}`);
    return { head: ref.object.sha, tree: commit.tree.sha };
  },
  async paths(t, treeSha) {

  },
  async blob(t, content) {
    const body = typeof content === 'string' ? { content, encoding: 'utf-8' } : { content: toB64(content), encoding: 'base64' };

  },
  async commit(t, at, entries, message) {
    const tree = await GH.api('POST', `${repoBase(t)}/git/trees`, { base_tree: at.tree, tree: entries.map(e => ({ path: e.path, mode: '100644', type: 'blob', sha: e.sha })) });
    const commit = await GH.api('POST', `${repoBase(t)}/git/commits`, { message, tree: tree.sha, parents: [at.head] });
    try { await GH.api('PATCH', `${repoBase(t)}/git/refs/heads/${t.branch}`, { sha: commit.sha, force: false }); }
    catch (e) { if (e instanceof GhError && e.status === 422) e.where = 'ref'; throw e; }
    return { head: commit.sha, tree: tree.sha };
  },
};

/* Что видят другие: всё, кроме скрытых записей и личных заметок у персонажей */
function filterState(src, o = {}) {
  const st = blankState(), keep = {};
  st.settings.theme = src.settings.theme; st.settings.sessionsAsc = src.settings.sessionsAsc;
  st.campaigns = src.campaigns.filter(c => !o.campaignId || c.id === o.campaignId).map(clone);
  const cids = new Set(st.campaigns.map(c => c.id));
  st.settings.campaign = cids.has(src.settings.campaign) ? src.settings.campaign : (st.campaigns[0] ? st.campaigns[0].id : null);
  for (const t of Object.keys(TYPES)) {
    st[t] = (t === 'notes' && o.notes === false ? [] : src[t].filter(e => cids.has(e.campaignId) && !e.secret)).map(clone);
    keep[t] = new Set(st[t].map(e => e.id));
  }
  st.sessions.forEach(x => { for (const k of ['characters', 'locations', 'threads']) x[k] = (x[k] || []).filter(id => keep[k].has(id)); });
  st.threads.forEach(x => { x.characters = (x.characters || []).filter(id => keep.characters.has(id)); });
  if (!o.charNotes) st.characters.forEach(x => { x.notes = ''; });
  return st;
}
function usedImages(st) {
  const u = new Set(), add = id => { if (id) u.add(id); };
  st.campaigns.forEach(c => add(c.cover));
  st.sessions.forEach(e => (e.images || []).forEach(add));
  st.characters.forEach(e => { add(e.portrait); (e.images || []).forEach(add); });
  st.locations.forEach(e => { add(e.image); (e.images || []).forEach(add); });
  return u;
}

/* Сохранение в интернет. Открытая часть лежит в общедоступном хранилище, полная — в закрытом. */
const Sync = {
  cfg: null, pub: null, prv: null, status: 'ok', error: '', conflict: false, timer: null, running: false, again: false, loading: null, progress: null,
  async open(t) { const at = await Git.headOf(t); return { t, at, paths: await Git.paths(t, at.tree) }; },
  schedule() { this.status = 'dirty'; this.paint(); clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1500); },
  async run(force) {
    clearTimeout(this.timer);
    if (this.running) { this.again = true; return; }
    this.running = true; this.again = false; this.status = 'saving'; this.paint();
    try { if (this.loading) await this.loading; await this.push(force); this.status = 'ok'; this.error = ''; this.conflict = false; }
    catch (e) {
      console.error(e); this.status = 'error';
      this.conflict = e instanceof GhError && e.where === 'ref';
      this.error = this.conflict ? 'Журнал изменили с другого устройства или вкладки.' : ghMessage(e);
    }
    this.running = false;
    if (this.status === 'ok' && this.again) return this.run();
    this.paint();
    if (this.status === 'error' && !this.conflict) toast('Не сохранено: ' + this.error, 6000);
    if (this.conflict) askConflict();
  },
  async push(force) {
    const c = this.cfg;
    if (!this.prv || force) this.prv = await this.open(privT(c));
    if (!this.pub || force) this.pub = await this.open(pubT(c));
    const snap = clone(S), pub = filterState(snap), pubImgs = usedImages(pub), old = snap.files || {};
    const files = {}, plan = { prv: [], pub: [] }, entries = { prv: [], pub: [] };
    for (const id of usedImages(snap)) {
      if (!/^[\w-]+$/.test(id) || (!IMG[id] && !old[id])) continue;
      const priv = !pubImgs.has(id), prev = old[id], key = priv ? 'prv' : 'pub';
      if (prev && prev.priv === priv && this[key].paths.has(`img/${id}.${prev.ext}`)) { files[id] = prev; continue; }
      if (!IMG[id]) { files[id] = prev; continue; }          // картинка ещё не загрузилась — оставляем как было
      files[id] = { ext: null, priv }; plan[key].push(id);
    }
    const total = plan.prv.length + plan.pub.length; let done = 0;
    for (const key of ['prv', 'pub']) for (const id of plan[key]) {
      const d = await imageData(id);
      if (!IMG[id].startsWith('data:')) IMG[id] = dataUrl(d.bytes, d.ext);   // картинка переезжает между хранилищами
      files[id].ext = d.ext;
      entries[key].push({ path: `img/${id}.${d.ext}`, sha: await Git.blob(this[key].t, d.bytes) });
      done++; if (this.progress) this.progress(done, total);
    }
    for (const key of ['prv', 'pub']) {
      const wanted = new Set(Object.entries(files).filter(([, f]) => f.priv === (key === 'prv')).map(([id, f]) => `img/${id}.${f.ext}`));
      for (const p of this[key].paths) if (p.startsWith('img/') && !wanted.has(p)) entries[key].push({ path: p, sha: null });
    }
    snap.files = files; snap.savedAt = pub.savedAt = Date.now();
    pub.files = {}; for (const [id, f] of Object.entries(files)) if (!f.priv) pub.files[id] = f.ext;
    entries.prv.push({ path: 'full.json', sha: await Git.blob(this.prv.t, JSON.stringify(snap)) });
    entries.pub.push({ path: 'public.json', sha: await Git.blob(this.pub.t, JSON.stringify(pub)) });
    for (const key of ['prv', 'pub']) {
      const store = this[key];
      store.at = await Git.commit(store.t, store.at, entries[key], 'Журнал: сохранение');
      for (const e of entries[key]) { if (e.sha) store.paths.add(e.path); else store.paths.delete(e.path); }
    }
    S.files = files;
  },
  label() {
    if (this.status === 'ok') return `<span class="ok">✓ Всё сохранено в интернете</span>`;
    if (this.status === 'error') return `<b>Не сохранено.</b> ${esc(this.error)} <button class="textlink" data-act="sync-retry">${this.conflict ? 'Сохранить мою версию поверх' : 'Повторить'}</button>`;
    return 'Сохраняю…';
  },
  paint() { const el = $('#sync-status'); if (el) { el.innerHTML = this.label(); el.className = 'sync ' + this.status; } },
};

/* Собирает отдельную страницу из этого же сайта: bootJs задаёт, с какими данными она откроется.

    o('meta name="viewport" content="width=device-width, initial-scale=1"'),

function sharedHtml(payload) {

      body: 'Утром Илья сводил Веру в портовую контору. Журнал действительно испорчен, но на корешке остался оттиск: груз «Северины» принимал лично Аркадий Штольц — за два дня до того, как маяк закрыли.\n\nДнём поднялись на Серый мыс. Штольц открыл не сразу и говорил через цепочку. Про огонь сказал только: «Я его не зажигаю. Я его гашу».\n\n## Вопросы на следующую игру\n\n- Что было в ящиках и почему их отвезли на маяк?\n- От кого Илья получил письмо, из-за которого вернулся?\n- Кто стоял на галерее, пока Штольц разговаривал с нами у двери?\n\nВечером в «Якоре» Вере передали записку без подписи: *«Уезжайте, пока ходит катер»*.' },

/* ═════════ Запуск ═════════ */
async function boot() {
  const shared = window.__SHARED__;
  let ok = false, st = null;
  if (shared && shared.state && shared.state.campaigns && shared.state.campaigns.length) {
    READONLY = true; SHARED_AT = shared.sharedAt || null;
    S = normalize(shared.state); IMG = shared.images || {};
    document.title = S.campaigns[0].name;
  } else if (ONLINE) {
    try { await bootOnline(); }
    catch (e) {
      console.error(e);
      return fatal('Журнал не загрузился', e instanceof GhError && e.status === 404 ? 'Записи журнала не найдены. Если сайт только что опубликован, подождите минуту и попробуйте ещё раз.' : esc(ghMessage(e)));
    }
    if (campaign()) document.title = campaign().name + ' — журнал кампании';
  } else {
    ok = await Store.init(); MEM = !ok;
    if (ok) { try { st = await Store.get('kv', 'state'); IMG = await Store.allImages(); } catch (e) { st = null; } }
    if (st) S = normalize(st);
    else {
      S = demoState(); IMG = Object.assign({}, window.__DEMO_IMAGES__ || {});
      if (ok) { for (const [id, v] of Object.entries(IMG)) Store.put('img', id, v); Store.put('kv', 'state', S); }
    }
    if (ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  applyTheme();
  $('#app').innerHTML = `
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div class="search">${ic('search')}<input id="search-in" type="text" placeholder="Поиск по кампании" autocomplete="off" aria-label="Поиск по кампании"><kbd>Ctrl K</kbd><div class="search-results" id="search-results" hidden></div></div>
        <span class="spacer"></span>
        ${READONLY ? '' : `<button class="btn primary" data-act="create-menu">${ic('plus')}Добавить</button>`}
        <button class="icon-btn only-narrow" data-act="more-menu" aria-label="Оформление и другие действия" title="Оформление и другие действия">${ic('dots')}</button>
      </header>
      <div id="notice"></div>
      <div class="scroll" id="scroll"><div class="view" id="view"></div></div>
    </div>`;
  route = parsePath(location.hash);
  render(true);
  if (bootNote) toast(bootNote, 6000);
}
boot();
})();
